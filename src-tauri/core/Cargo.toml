[package]
name = "tidytag-core"
version = "2.0.0"
edition = "2021"

[lib]
name = "tidytag_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
